# CI/CD (ADR-0023). Un solo flujo para que nada se despliegue sin pasar la CI:
#   PR   → calidad + E2E → preview en Vercel (remote + shell) → Lighthouse sobre el preview
#   main → calidad + E2E → migraciones Neon → BFF en Render → remote → shell → Lighthouse
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  # En un PR solo importa el último commit; en main no se interrumpe un despliegue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read # nx-set-shas busca el último commit de main que pasó la CI

env:
  NX_NO_CLOUD: 'true'
  VERCEL_CLI: vercel@65.0.0

jobs:
  quality:
    name: Lint, typecheck, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: nrwl/nx-set-shas@v4
      - run: pnpm nx format:check
      - run: pnpm nx affected -t lint typecheck test build --outputStyle=static

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Mismas credenciales que docker-compose.yml: solo existen dentro del runner.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qolqa
          POSTGRES_PASSWORD: qolqa_dev_only
          POSTGRES_DB: qolqa
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U qolqa -d qolqa"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Navegadores de Playwright
        run: pnpm --filter @qolqa/shell-react-e2e exec playwright install --with-deps chromium firefox webkit
      - run: pnpm nx e2e shell-react-e2e --outputStyle=static
      - name: Informe y trazas si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/shell-react-e2e/test-output
          retention-days: 7

  preview:
    name: Preview en Vercel
    needs: [quality, e2e]
    # Los PR desde forks no tienen acceso a los secretos.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.shell.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm install --global ${{ env.VERCEL_CLI }}
      - name: Remote Angular (preview)
        id: remote
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_INVESTMENTS }}
        run: |
          pnpm nx run mf-investments:build --outputStyle=static
          node apps/mf-investments/scripts/vercel-output.mjs
          url=$(cd apps/mf-investments && vercel deploy --prebuilt --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Desde la raíz: el proyecto tiene Root Directory = apps/shell-react y la
      # función SSR referencia archivos del monorepo con rutas desde la raíz.
      - name: Shell React (preview)
        id: shell
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_SHELL }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: preview
          VITE_WS_URL: ${{ vars.API_ORIGIN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: qolqa-shell
          SENTRY_RELEASE: ${{ github.sha }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          # El preview del shell usa el remote de este mismo PR.
          INVESTMENTS_ORIGIN: ${{ steps.remote.outputs.url }}
        run: |
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
          (cd apps/shell-react && pnpm exec tsx scripts/vercel-output.ts)
          url=$(vercel deploy --prebuilt --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview"
            echo "- Banca web: $url"
            echo "- Remote Angular: ${{ steps.remote.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
      # Lighthouse guarda las cabeceras en el informe: con el secreto de bypass no
      # se publica nada, solo se comprueban los presupuestos.
      - name: Configuración de Lighthouse con bypass (no se sube)
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node -e "
            const config = require('./lighthouserc.json');
            config.ci.collect.settings = { ...config.ci.collect.settings, extraHeaders: { 'x-vercel-protection-bypass': process.env.BYPASS } };
            require('fs').writeFileSync(process.env.RUNNER_TEMP + '/lhci-preview.json', JSON.stringify(config));
          "
      - name: Lighthouse (presupuestos)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.shell.outputs.url }}/
            ${{ steps.shell.outputs.url }}/seguridad
            ${{ steps.shell.outputs.url }}/tipo-de-cambio
          configPath: ${{ runner.temp }}/lhci-preview.json
          uploadArtifacts: false
          temporaryPublicStorage: false

  production:
    name: Despliegue a producción
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm install --global ${{ env.VERCEL_CLI }}

      - name: Migraciones en Neon (conexión directa)
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: pnpm exec prisma migrate deploy

      - name: BFF en Render (commit exacto)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: node tools/deploy/render-deploy.mjs ${{ github.sha }}

      - name: Verificación del BFF (con base de datos)
        run: curl --fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors --max-time 90 "${{ vars.API_ORIGIN }}/api/health"

      - name: Remote Angular
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_INVESTMENTS }}
        run: |
          pnpm nx run mf-investments:build --outputStyle=static
          node apps/mf-investments/scripts/vercel-output.mjs
          cd apps/mf-investments && vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Shell React
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_SHELL }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_WS_URL: ${{ vars.API_ORIGIN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: qolqa-shell
          SENTRY_RELEASE: ${{ github.sha }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          INVESTMENTS_ORIGIN: ${{ vars.INVESTMENTS_URL }}
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          (cd apps/shell-react && pnpm exec tsx scripts/vercel-output.ts)
          vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Lighthouse (informe público temporal)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ vars.SITE_URL }}/
            ${{ vars.SITE_URL }}/seguridad
            ${{ vars.SITE_URL }}/tipo-de-cambio
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
